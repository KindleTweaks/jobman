[package]
name = "jobman"
version = "1.2.2"
edition = "2024"

[dependencies]
slint = { version = "=1.17.1", default-features = false, features = ["compat-1-2", "std", "renderer-software"] }
slint-backend-kindle = "0.7.1"
fontique = { version = "=0.10.0", features = ["fontconfig-dlopen"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
glob = "0.3.2"

[target.'cfg(not(all(target_os = "linux", target_arch = "arm")))'.dependencies]
slint = { version = "=1.17.1", features = ["backend-default"] }

[build-dependencies]
slint-build = "=1.17.1"

[patch.crates-io]
slint-backend-kindle = { git = "https://github.com/KindleTweaks/slint-kindle-backend-patch" }
